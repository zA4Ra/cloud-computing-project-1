name: Cloud Computing CI/CD

on:
  push:
    branches: [main, task4-5-setup]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile data_analysis.py
          python -m py_compile lambda_function.py
          python -m py_compile benchmark.py

      - name: Build Docker image
        run: docker build -t diet-analysis .

      - name: Verify Docker image
        run: docker image inspect diet-analysis
      - name: Simulate container deployment
        run: |
          docker run --rm --entrypoint python diet-analysis -c "print('Container started successfully')"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag diet-analysis ${{ secrets.DOCKERHUB_USERNAME }}/diet-analysis:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/diet-analysis:latest
